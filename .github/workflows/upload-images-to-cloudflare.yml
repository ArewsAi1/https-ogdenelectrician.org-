name: Upload Ogden Electrician Images to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '.github/workflows/upload-images-to-cloudflare.yml'

permissions:
  contents: read
  issues: write

jobs:
  upload-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload images through temporary Cloudflare Worker
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/cloudflare-upload.log
          endpoint='https://ogdenelectrician-image-uploader.aj-ce0.workers.dev/upload-7f3c9a1e5b2d4f6a8c0e9d1b3a5f7c2e'
          uploaded=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            case "${filename,,}" in
              *.jpg|*.jpeg) content_type='image/jpeg' ;;
              *.png) content_type='image/png' ;;
              *.webp) content_type='image/webp' ;;
              *) continue ;;
            esac

            echo "Uploading $filename" | tee -a /tmp/cloudflare-upload.log
            status="$(curl --silent --show-error --output /tmp/upload-response.json --write-out '%{http_code}' \
              --request PUT \
              --header "Content-Type: ${content_type}" \
              --data-binary "@${file}" \
              "${endpoint}?name=${filename}")"

            cat /tmp/upload-response.json | tee -a /tmp/cloudflare-upload.log
            echo | tee -a /tmp/cloudflare-upload.log

            if [ "$status" != '200' ]; then
              echo "Upload failed with HTTP $status for $filename" | tee -a /tmp/cloudflare-upload.log
              exit 1
            fi
            uploaded=$((uploaded + 1))
          done < <(find . -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0)

          echo "Uploaded files: $uploaded" | tee -a /tmp/cloudflare-upload.log
          if [ "$uploaded" -lt 70 ]; then
            echo "Expected at least 70 image files." | tee -a /tmp/cloudflare-upload.log
            exit 1
          fi

      - name: Report diagnostic issue
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'The temporary Worker image upload failed.'
            echo
            echo '```text'
            tail -n 120 /tmp/cloudflare-upload.log
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue-body.md
          gh issue create --title "Temporary Worker image upload diagnostic" --body-file /tmp/issue-body.md

      - name: Fail workflow when upload failed
        if: steps.upload.outcome == 'failure'
        run: exit 1
