name: Upload Ogden Electrician Images to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.gif'
      - '*.svg'
      - '.github/workflows/upload-images-to-cloudflare.yml'

permissions:
  contents: read

jobs:
  upload-images:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
      KV_NAMESPACE_ID: 3c9e34f463394469837a6e8744a0602e

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare token is present."

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Cloudflare authentication
        run: wrangler whoami

      - name: Upload optimized images with Wrangler
        shell: bash
        run: |
          set -euo pipefail
          uploaded=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            key="/assets/images/$filename"
            echo "Uploading $key"
            wrangler kv key put "$key" \
              --namespace-id "$KV_NAMESPACE_ID" \
              --path "$file" \
              --remote
            uploaded=$((uploaded + 1))
          done < <(find . -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' \) -print0)

          echo "Uploaded files: $uploaded"
          if [ "$uploaded" -lt 70 ]; then
            echo "Expected at least 70 image files in the repository root."
            exit 1
          fi

      - name: Verify remote KV image count
        shell: bash
        run: |
          set -euo pipefail
          wrangler kv key list \
            --namespace-id "$KV_NAMESPACE_ID" \
            --prefix "/assets/images/" \
            --remote \
            > /tmp/kv-keys.json

          python3 - <<'PY'
          import json
          with open('/tmp/kv-keys.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f"Cloudflare KV image keys found: {len(data)}")
          if len(data) < 70:
              raise SystemExit(f"Expected at least 70 image keys, found {len(data)}")
          PY
