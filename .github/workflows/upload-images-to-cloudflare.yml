name: Upload Ogden Electrician Images to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.webp'
      - '*.gif'
      - '*.svg'
      - '.github/workflows/upload-images-to-cloudflare.yml'

permissions:
  contents: read
  issues: write

jobs:
  upload-images:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
      KV_NAMESPACE_ID: 3c9e34f463394469837a6e8744a0602e

    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Upload and verify
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/cloudflare-upload.log

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN" | tee -a /tmp/cloudflare-upload.log
            exit 1
          fi

          echo "=== Wrangler authentication ===" | tee -a /tmp/cloudflare-upload.log
          wrangler whoami 2>&1 | tee -a /tmp/cloudflare-upload.log || exit 1

          uploaded=0
          echo "=== Image upload ===" | tee -a /tmp/cloudflare-upload.log
          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            key="/assets/images/$filename"
            echo "Uploading $key" | tee -a /tmp/cloudflare-upload.log
            wrangler kv key put "$key" --namespace-id "$KV_NAMESPACE_ID" --path "$file" --remote 2>&1 | tee -a /tmp/cloudflare-upload.log || exit 1
            uploaded=$((uploaded + 1))
          done < <(find . -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' \) -print0)

          echo "Uploaded files: $uploaded" | tee -a /tmp/cloudflare-upload.log
          if [ "$uploaded" -lt 70 ]; then
            echo "Expected at least 70 image files." | tee -a /tmp/cloudflare-upload.log
            exit 1
          fi

          echo "=== Remote verification ===" | tee -a /tmp/cloudflare-upload.log
          wrangler kv key list --namespace-id "$KV_NAMESPACE_ID" --prefix "/assets/images/" --remote 2>&1 | tee -a /tmp/cloudflare-upload.log

      - name: Report diagnostic issue
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sed -E 's/(Bearer|token|Token|TOKEN)[=: ]+[A-Za-z0-9._-]+/\1 [REDACTED]/g' /tmp/cloudflare-upload.log > /tmp/redacted.log
          {
            echo 'The automated Cloudflare image upload failed.'
            echo
            echo '```text'
            tail -n 120 /tmp/redacted.log
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue-body.md
          gh issue create --title "Cloudflare image upload diagnostic" --body-file /tmp/issue-body.md

      - name: Fail workflow when upload failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
