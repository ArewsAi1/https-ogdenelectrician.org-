name: Upload Preference Static Assets

on:
  pull_request:
    paths:
      - 'temp-taxidermy/**'
      - '.github/workflows/upload-taxidermy-kv.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload three verified assets
        env:
          ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
          UPLOAD_JWT: cfwau_eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..iecUu39k6gk0koZjy_dudAEhl39maYCpJsPVFpuQRjjfJvZ_46qys-AumGH31LhhKgd4Jlho7sdg6qvAkC_sCA
        run: |
          set -euo pipefail
          upload_one() {
            local name="$1"
            local hash="$2"
            curl -fsSL "https://raw.githubusercontent.com/ArewsAi1/https-ogdenelectrician.org-/main/temp-taxidermy/${name}.webp.b64" -o "/tmp/${name}.b64"
            response=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $UPLOAD_JWT" \
              --form-string "${hash}=$(cat /tmp/${name}.b64)" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/assets/upload?base64=true")
            echo "$response"
          }
          upload_one taxidermy-03 92c52077b585735585772061ba0f2653
          upload_one taxidermy-06 bcd2cd7802607e8860b7fb21462522ca
          upload_one taxidermy-05 9dadc665704e7ce562a3926a4e0c235e
