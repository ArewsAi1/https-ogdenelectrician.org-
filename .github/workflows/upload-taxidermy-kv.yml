name: Diagnose Preference Static Asset Upload

on:
  pull_request:
    paths:
      - 'temp-taxidermy/**'
      - '.github/workflows/upload-taxidermy-kv.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Test one asset upload
        env:
          ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
          UPLOAD_JWT: cfwau_eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..c0YA4VekkBSQ4eHLRW15BxYtfNvNwPyW6ZaiLub0fcvSwHeH5asCVfkX3EfR94o0oorEVF7G4Mukkq3MjsraDw
        run: |
          set -u
          curl -fsSL 'https://raw.githubusercontent.com/ArewsAi1/https-ogdenelectrician.org-/main/temp-taxidermy/taxidermy-03.webp.b64' -o /tmp/image.b64
          status=$(curl --silent --show-error -o /tmp/response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $UPLOAD_JWT" \
            -F "92c52077b585735585772061ba0f2653=</tmp/image.b64;type=image/webp" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/assets/upload?base64=true")
          echo "HTTP_STATUS=$status"
          cat /tmp/response.json
