name: Upload Preference Taxidermy Static Assets

on:
  pull_request:
    paths:
      - 'temp-taxidermy/**'
      - '.github/workflows/upload-taxidermy-kv.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload static image assets
        env:
          ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
          UPLOAD_JWT: cfwau_eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..ZGxhmGPUlfCpqKdVLlJLrLZhuwpknHKjUSg9BcLP4pxWhCXprWy6nRr9BCwE5hSaj8h-RjAXafD0fml02yJ5BQ
        run: |
          set -euo pipefail
          completion=''
          upload_one() {
            local name="$1"
            local hash="$2"
            local source="temp-taxidermy/${name}.webp.b64"
            test -s "$source"
            response=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $UPLOAD_JWT" \
              -F "${hash}=<${source};type=image/webp" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/assets/upload?base64=true")
            echo "$response"
            token=$(printf '%s' "$response" | python -c 'import json,sys; print((json.load(sys.stdin).get("result") or {}).get("jwt") or "")')
            if [ -n "$token" ]; then completion="$token"; fi
          }
          upload_one taxidermy-03 92c52077b585735585772061ba0f2653
          upload_one taxidermy-06 bcd2cd7802607e8860b7fb21462522ca
          upload_one taxidermy-05 9dadc665704e7ce562a3926a4e0c235e
          test -n "$completion"
          echo "COMPLETION_JWT=$completion"
