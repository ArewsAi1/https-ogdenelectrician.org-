name: Verify and Upload Preference Asset

on:
  pull_request:
    paths:
      - 'temp-taxidermy/**'
      - '.github/workflows/upload-taxidermy-kv.yml'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Verify payload and upload
        env:
          ACCOUNT_ID: ce0b2ff32c4f7327c83e7704c33a7c8c
          UPLOAD_JWT: cfwau_eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9..L49q0fP-1yoogg1b2vsxPh0vo0-2AurKm5o1DyQJ7EyxGPs19kTszbogNfPiT3P3RtyXi_h_XVhrLqh94xz0AQ
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ArewsAi1/https-ogdenelectrician.org-/main/temp-taxidermy/taxidermy-03.webp.b64' -o /tmp/image.b64
          base64 --decode /tmp/image.b64 > /tmp/image.webp
          echo "BASE64_BYTES=$(wc -c < /tmp/image.b64)"
          echo "IMAGE_BYTES=$(wc -c < /tmp/image.webp)"
          echo "IMAGE_MD5=$(md5sum /tmp/image.webp | cut -d' ' -f1)"
          value=$(cat /tmp/image.b64)
          status=$(curl --silent --show-error -o /tmp/response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $UPLOAD_JWT" \
            -F "92c52077b585735585772061ba0f2653=${value}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/assets/upload?base64=true")
          echo "HTTP_STATUS=$status"
          cat /tmp/response.json
          test "$status" = "201"
